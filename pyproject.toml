[build-system]
requires = ["setuptools>=64", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "cordiag"
version = "0.1.1"
description = "zPG and TG diagnostics for RNA-to-protein translation transferability"
readme = "README.md"
requires-python = ">=3.12"
license = {text = "MIT"}
authors = [{name = "Gong Zhuozhi"}]
keywords = ["zPG", "transportability", "RNA-protein", "proteomics", "bioinformatics"]
dependencies = [
    "numpy>=1.24",
    "scipy>=1.10,<1.18",
    "pandas>=1.5",
    "scikit-learn>=1.1",
    "statsmodels>=0.14",
]

[project.optional-dependencies]
dev = ["pytest"]

[project.scripts]
cordiag = "cordiag.cli:main"

[project.urls]
Homepage = "https://github.com/brvnw2d5tk-ctrl/cordiag"

[tool.setuptools]
packages = ["cordiag"]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
pythonpath = ["."]
norecursedirs = ["*.egg-info", "build", "dist"]
